Screens:
  ProjectFormScreen:
    Properties:
      Fill: =RGBA(237, 234, 226, 1)
    Children:
      - FormTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(15, 27, 46, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =42
            Size: =18
            Text: =If(IsBlank(varSelProject), "Nieuw project", "Project bewerken")
            Width: =Parent.Width - 40
            X: =20
            Y: =20
      - InKlant:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =If(IsBlank(varSelProject), "", varSelProject.KlantNaam)
            HintText: ="Klantnaam"
            Height: =44
            Width: =Parent.Width - 40
            X: =20
            Y: =70
      - InAdres:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =If(IsBlank(varSelProject), "", varSelProject.Adres)
            HintText: ="Adres"
            Height: =44
            Width: =Parent.Width - 40
            X: =20
            Y: =122
      - InContactNaam:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =If(IsBlank(varSelProject), "", varSelProject.ContactNaam)
            HintText: ="Contactpersoon"
            Height: =44
            Width: =Parent.Width - 40
            X: =20
            Y: =174
      - InContactEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =If(IsBlank(varSelProject), "", varSelProject.ContactEmail)
            HintText: ="E-mail contactpersoon"
            Height: =44
            Width: =Parent.Width - 40
            X: =20
            Y: =226
      - InPMEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =If(IsBlank(varSelProject), "", varSelProject.ProjectManagerEmail)
            HintText: ="E-mail projectmanager"
            Height: =44
            Width: =Parent.Width - 40
            X: =20
            Y: =278
      - AddPicProjectFoto:
          Control: Classic/AddPicture@2.1.0
          Properties:
            Height: =160
            Width: =Parent.Width - 40
            X: =20
            Y: =340
      - BtnSaveProject:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 222, 0, 1)
            Fill: =RGBA(5, 30, 80, 1)
            Height: =52
            OnSelect: |-
              =If(IsBlank(varSelProject),
                Patch(Projecten, Defaults(Projecten), {
                  KlantNaam: InKlant.Text, Adres: InAdres.Text, ContactNaam: InContactNaam.Text,
                  ContactEmail: InContactEmail.Text, ProjectManagerEmail: InPMEmail.Text, Status: "Open",
                  Attachments: Filter(Table({Name: "projectfoto.png", Value: AddPicProjectFoto.Image}), !IsBlank(Value))
                }),
                Patch(Projecten, varSelProject, {
                  KlantNaam: InKlant.Text, Adres: InAdres.Text, ContactNaam: InContactNaam.Text,
                  ContactEmail: InContactEmail.Text, ProjectManagerEmail: InPMEmail.Text,
                  Attachments: Filter(Table({Name: "projectfoto.png", Value: AddPicProjectFoto.Image}), !IsBlank(Value))
                }));
              Refresh(Projecten);
              ClearCollect(colProjecten, Projecten);
              Navigate(ProjectsScreen, ScreenTransition.Fade)
            Text: ="Opslaan"
            Width: =Parent.Width - 40
            X: =20
            Y: =510
      - BtnBackForm:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(5, 30, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            OnSelect: =Back()
            Text: ="Terug"
            Width: =Parent.Width - 40
            X: =20
            Y: =574
