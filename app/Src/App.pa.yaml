App:
  Properties:
    Theme: =PowerAppsTheme
    StartScreen: =HomeScreen
    OnStart: |-
      =Set(varRole, "");
      Set(varWizardStep, 1);
      Set(varLogStatus, "open");
      Set(varMonteurFilter, "");
      Set(varSelProject, Blank());
      Set(varSelLog, Blank());
      ClearCollect(colProjecten, Projecten);
      ClearCollect(colLogboek, Logboek);
      ClearCollect(colManagers, Managers);
      ClearCollect(colMedewerkers, Medewerkers);
      ClearCollect(colTaken, Taken)
