Screens:
  LogbookScreen:
    Properties:
      Fill: =RGBA(237, 234, 226, 1)
    Children:
      - LogTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(15, 27, 46, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =42
            Size: =18
            Text: ="Logboek"
            Width: =Parent.Width - 40
            X: =20
            Y: =20
      - BtnLogOpen:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 222, 0, 1)
            Fill: =RGBA(5, 30, 80, 1)
            Height: =40
            OnSelect: =Set(varLogStatus, "Open")
            Text: ="Open"
            Width: =(Parent.Width - 60) / 3
            X: =20
            Y: =66
      - BtnLogAfgerond:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(5, 30, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =40
            OnSelect: =Set(varLogStatus, "Afgerond")
            Text: ="Afgerond"
            Width: =(Parent.Width - 60) / 3
            X: =30 + (Parent.Width - 60) / 3
            Y: =66
      - BtnLogAlle:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(5, 30, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =40
            OnSelect: =Set(varLogStatus, "Alle")
            Text: ="Alle"
            Width: =(Parent.Width - 60) / 3
            X: =40 + 2 * (Parent.Width - 60) / 3
            Y: =66
      - GalLogboek:
          Control: Gallery@2.15.0
          Properties:
            Height: =Parent.Height - 170
            Items: |-
              =SortByColumns(
                Filter(colLogboek, varLogStatus = "Alle" || Status = varLogStatus),
                "Datum", Descending)
            Layout: =Layout.Vertical
            TemplateSize: =70
            Width: =Parent.Width
            X: =0
            Y: =120
          Children:
            - LogItemLabel:
                Control: Label@2.5.1
                Properties:
                  Height: =Parent.TemplateHeight - 20
                  Text: =ThisItem.Project & " - " & ThisItem.Status
                  Width: =Parent.TemplateWidth - 40
                  X: =20
                  Y: =10
            - BtnLogItemOpen:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =1
                  OnSelect: |-
                    =Set(varSelLog, ThisItem);
                    Navigate(LogbookDetailScreen, ScreenTransition.Fade)
                  Text: ="Openen"
                  Width: =1
                  X: =0
                  Y: =0
      - BtnLogBack:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(5, 30, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            OnSelect: =Back()
            Text: ="Terug"
            Width: =Parent.Width - 40
            X: =20
            Y: =Parent.Height - 70
