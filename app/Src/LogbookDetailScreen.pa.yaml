Screens:
  LogbookDetailScreen:
    Properties:
      Fill: =RGBA(237, 234, 226, 1)
    Children:
      - LogDetTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(15, 27, 46, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =42
            Size: =18
            Text: =varSelLog.Project
            Width: =Parent.Width - 40
            X: =20
            Y: =20
      - LblLogMonteur:
          Control: Label@2.5.1
          Properties:
            Height: =32
            Text: ="Monteur: " & varSelLog.Monteur
            Width: =Parent.Width - 40
            X: =20
            Y: =66
      - LblLogChecklist:
          Control: Label@2.5.1
          Properties:
            Height: =80
            Text: =varSelLog.Checklist
            Width: =Parent.Width - 40
            X: =20
            Y: =104
      - BtnLogMarkAfgerond:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 222, 0, 1)
            Fill: =RGBA(5, 30, 80, 1)
            Height: =48
            OnSelect: |-
              =Patch(Logboek, varSelLog, {Status: "Afgerond"});
              Refresh(Logboek);
              ClearCollect(colLogboek, Logboek);
              Back()
            Text: ="Markeer als afgerond"
            Width: =Parent.Width - 40
            X: =20
            Y: =200
      - BtnLogDetBack:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(5, 30, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            OnSelect: =Back()
            Text: ="Terug"
            Width: =Parent.Width - 40
            X: =20
            Y: =260
