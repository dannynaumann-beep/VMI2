Screens:
  WizardScreen:
    Properties:
      Fill: =RGBA(237, 234, 226, 1)
    Children:
      - WizTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(15, 27, 46, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =42
            Size: =18
            Text: ="Werkbon - stap " & varWizardStep & " van 5"
            Width: =Parent.Width - 40
            X: =20
            Y: =20
      - WizProject:
          Control: Label@2.5.1
          Properties:
            Height: =32
            Text: =varSelProject.KlantNaam
            Width: =Parent.Width - 40
            X: =20
            Y: =62
      - WizStep1Checklist:
          Control: GroupContainer@1.5.0
          Properties:
            Visible: =varWizardStep = 1
            Height: =Parent.Height - 220
            Width: =Parent.Width - 40
            X: =20
            Y: =100
      - InWizChecklist:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: ="Checklist / uitgevoerde werkzaamheden"
            Height: =100
            Mode: =TextMode.MultiLine
            Visible: =varWizardStep = 1
            Width: =Parent.Width - 40
            X: =20
            Y: =100
      - InWizOpmerking:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: ="Opmerkingen"
            Height: =100
            Mode: =TextMode.MultiLine
            Visible: =varWizardStep = 3
            Width: =Parent.Width - 40
            X: =20
            Y: =100
      - InWizVervolg:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: ="Vervolgactie / status"
            Height: =60
            Visible: =varWizardStep = 4
            Width: =Parent.Width - 40
            X: =20
            Y: =100
      - AddPicWizFoto:
          Control: Classic/AddPicture@2.1.0
          Properties:
            Height: =240
            Visible: =varWizardStep = 2
            Width: =Parent.Width - 40
            X: =20
            Y: =100
      - InkMonteur:
          Control: Classic/PenInput@2.0.0
          Properties:
            Height: =160
            Visible: =varWizardStep = 5
            Width: =Parent.Width - 40
            X: =20
            Y: =100
      - InkKlant:
          Control: Classic/PenInput@2.0.0
          Properties:
            Height: =160
            Visible: =varWizardStep = 5
            Width: =Parent.Width - 40
            X: =20
            Y: =280
      - BtnWizPrev:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(5, 30, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            OnSelect: =If(varWizardStep > 1, Set(varWizardStep, varWizardStep - 1), Back())
            Text: ="Vorige"
            Width: =(Parent.Width - 60) / 2
            X: =20
            Y: =Parent.Height - 70
      - BtnWizNext:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 222, 0, 1)
            Fill: =RGBA(5, 30, 80, 1)
            Height: =48
            OnSelect: |-
              =If(varWizardStep < 5,
                Set(varWizardStep, varWizardStep + 1),
                Patch(Logboek, Defaults(Logboek), {
                  Project: varSelProject.Title,
                  Monteur: User().FullName,
                  Checklist: InWizChecklist.Text,
                  Opmerking: InWizOpmerking.Text,
                  Vervolgactie: InWizVervolg.Text,
                  Status: "Open",
                  Datum: Now(),
                  Attachments: Filter(
                    Table(
                      {Name: "sigMonteur.png", Value: InkMonteur.Image},
                      {Name: "sigKlant.png", Value: InkKlant.Image},
                      {Name: "foto1.png", Value: AddPicWizFoto.Image}
                    ),
                    !IsBlank(Value))
                });
                Refresh(Logboek);
                ClearCollect(colLogboek, Logboek);
                Navigate(TechnicianScreen, ScreenTransition.Fade))
            Text: =If(varWizardStep < 5, "Volgende", "Afronden")
            Width: =(Parent.Width - 60) / 2
            X: =40 + (Parent.Width - 60) / 2
            Y: =Parent.Height - 70
